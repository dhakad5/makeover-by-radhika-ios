<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" role="img" aria-label="Makeover by Radhika">
  <defs>
    <!-- Sage gradient (outer disc) -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7d9967"/>
      <stop offset="60%" stop-color="#4d6741"/>
      <stop offset="100%" stop-color="#314229"/>
    </linearGradient>
    <!-- Terracotta gradient (inner R) -->
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#df8a51"/>
      <stop offset="60%"  stop-color="#c97a4f"/>
      <stop offset="100%" stop-color="#93482a"/>
    </linearGradient>
    <!-- Cream gradient (inner disc) -->
    <radialGradient id="creamGrad" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#fffaf3"/>
      <stop offset="60%"  stop-color="#fbf3e4"/>
      <stop offset="100%" stop-color="#e9dec5"/>
    </radialGradient>
    <!-- Brass accent -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d8b770"/>
      <stop offset="100%" stop-color="#947124"/>
    </linearGradient>
    <!-- Subtle shadow -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Single leaf shape -->
    <g id="leaf">
      <path d="M 0 0 Q 6 -8 0 -22 Q -6 -8 0 0 Z"
            fill="#9ab287" stroke="#4d6741" stroke-width="0.7" stroke-linejoin="round"/>
      <line x1="0" y1="-1" x2="0" y2="-20" stroke="#4d6741" stroke-width="0.5"/>
    </g>

    <!-- Arched paths for circular text -->
    <path id="arcTop"    d="M 50 140 A 90 90 0 0 1 230 140" fill="none"/>
    <path id="arcBottom" d="M 55 148 A 85 85 0 0 0 225 148" fill="none"/>
  </defs>

  <!-- ============== OUTER SAGE DISC ============== -->
  <circle cx="140" cy="140" r="132" fill="url(#sageGrad)"/>
  <circle cx="140" cy="140" r="132" fill="none" stroke="url(#brassGrad)" stroke-width="2.5"/>

  <!-- Decorative botanical wreath (leaves around the ring) -->
  <g opacity="0.85">
    <!-- 12 leaves around the circle, evenly spaced -->
    <g transform="translate(140,28) rotate(0)"><use href="#leaf"/></g>
    <g transform="translate(196,42) rotate(30)"><use href="#leaf"/></g>
    <g transform="translate(238,84) rotate(60)"><use href="#leaf"/></g>
    <g transform="translate(252,140) rotate(90)"><use href="#leaf"/></g>
    <g transform="translate(238,196) rotate(120)"><use href="#leaf"/></g>
    <g transform="translate(196,238) rotate(150)"><use href="#leaf"/></g>
    <g transform="translate(140,252) rotate(180)"><use href="#leaf"/></g>
    <g transform="translate(84,238)  rotate(210)"><use href="#leaf"/></g>
    <g transform="translate(42,196)  rotate(240)"><use href="#leaf"/></g>
    <g transform="translate(28,140)  rotate(270)"><use href="#leaf"/></g>
    <g transform="translate(42,84)   rotate(300)"><use href="#leaf"/></g>
    <g transform="translate(84,42)   rotate(330)"><use href="#leaf"/></g>
  </g>

  <!-- Inner cream disc -->
  <circle cx="140" cy="140" r="108" fill="url(#creamGrad)" filter="url(#softShadow)"/>
  <circle cx="140" cy="140" r="108" fill="none" stroke="url(#brassGrad)" stroke-width="1.5"/>
  <circle cx="140" cy="140" r="103" fill="none" stroke="url(#brassGrad)" stroke-width="0.5" opacity="0.55"/>

  <!-- ============== ARCHED TEXT (small uppercase) ============== -->
  <text font-family="Fraunces, Georgia, serif" font-size="11" font-weight="700"
        fill="#3d5234" letter-spacing="5">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">M A K E O V E R  •  B Y</textPath>
  </text>

  <text font-family="Fraunces, Georgia, serif" font-size="15" font-weight="700"
        fill="#3d5234" letter-spacing="9">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">R A D H I K A</textPath>
  </text>

  <!-- ============== SAGE LEAF SPRIG (above monogram) ============== -->
  <g transform="translate(140,98)" filter="url(#softShadow)">
    <!-- 3-leaf sprig -->
    <path d="M 0 0 L 0 -16" stroke="#3d5234" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M -1 -6 Q -10 -10 -12 -2 Q -6 -2 -1 -6 Z" fill="#7d9967" stroke="#4d6741" stroke-width="0.6"/>
    <!-- Right leaf -->
    <path d="M 1 -10 Q 10 -14 12 -6 Q 6 -6 1 -10 Z" fill="#7d9967" stroke="#4d6741" stroke-width="0.6"/>
    <!-- Center top leaf -->
    <path d="M 0 -16 Q -5 -22 0 -28 Q 5 -22 0 -16 Z" fill="#9ab287" stroke="#4d6741" stroke-width="0.6"/>
    <!-- Tiny berry -->
    <circle cx="0" cy="-3" r="2" fill="url(#brassGrad)"/>
  </g>

  <!-- ============== HERO: CURSIVE R MONOGRAM ============== -->
  <g transform="translate(140,176)" filter="url(#softShadow)">
    <text x="0" y="0" text-anchor="middle"
          font-family="Fraunces, 'Playfair Display', Georgia, serif"
          font-size="100" font-weight="900" font-style="italic"
          fill="url(#clayGrad)">R</text>
    <!-- Flourish under R (brass) -->
    <path d="M -30 18 C -12 26, 12 26, 30 18" stroke="url(#brassGrad)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="-30" cy="18" r="1.7" fill="url(#brassGrad)"/>
    <circle cx="30"  cy="18" r="1.7" fill="url(#brassGrad)"/>
    <circle cx="0"   cy="24" r="2" fill="url(#brassGrad)"/>
  </g>

  <!-- ============== SIDE LEAF SPRIGS (botanical) ============== -->
  <g opacity="0.9">
    <g transform="translate(46,142)">
      <path d="M 0 -10 Q -6 -8 -8 -2 Q -2 -2 0 -10 Z" fill="#7d9967" stroke="#4d6741" stroke-width="0.5"/>
      <path d="M 0 0 Q -8 4 -10 12 Q -2 10 0 0 Z" fill="#7d9967" stroke="#4d6741" stroke-width="0.5"/>
      <path d="M 0 -10 L 0 12" stroke="#4d6741" stroke-width="0.6"/>
      <circle cx="0" cy="-2" r="1.6" fill="url(#brassGrad)"/>
    </g>
    <g transform="translate(234,142)">
      <path d="M 0 -10 Q 6 -8 8 -2 Q 2 -2 0 -10 Z" fill="#7d9967" stroke="#4d6741" stroke-width="0.5"/>
      <path d="M 0 0 Q 8 4 10 12 Q 2 10 0 0 Z" fill="#7d9967" stroke="#4d6741" stroke-width="0.5"/>
      <path d="M 0 -10 L 0 12" stroke="#4d6741" stroke-width="0.6"/>
      <circle cx="0" cy="-2" r="1.6" fill="url(#brassGrad)"/>
    </g>
  </g>

  <!-- ============== CORNER SPARKLES ============== -->
  <g fill="#fdfaf3" opacity="0.75">
    <path d="M 82 78 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 l 4 -1.5 z"/>
    <path d="M 198 78 l 1.2 3 l 3 1.2 l -3 1.2 l -1.2 3 l -1.2 -3 l -3 -1.2 l 3 -1.2 z"/>
    <path d="M 205 200 l 1.2 3 l 3 1.2 l -3 1.2 l -1.2 3 l -1.2 -3 l -3 -1.2 l 3 -1.2 z"/>
    <path d="M 75 200 l 1.2 3 l 3 1.2 l -3 1.2 l -1.2 3 l -1.2 -3 l -3 -1.2 l 3 -1.2 z"/>
  </g>
</svg>
